[project]
name = "issue-agent"
version = "0.1.0"
description = "Autonomous issue-resolving harness — Python + Claude Agent SDK port"
requires-python = ">=3.10"
# The domain layer is dependency-free by design (pure stdlib). Adapters that
# import the SDK / pydantic are added in later phases as optional extras.
dependencies = []

# The operator-facing CLI (`issue-agent <cmd>`). Pure argparse + stdlib, so it
# adds no dependency; it resolves the harness checkout from its own __file__ and
# delegates the heavy lifting to bin/point-at.sh. Installed by `bin/install.sh`
# via an EDITABLE install (`uv sync`), which is what keeps the __file__ walk able
# to find the sibling plugin/ + config/ trees — a plain wheel omits them.
[project.scripts]
issue-agent = "issue_agent.app.cli:main"

# The adapter layer (Phase 2+) imports the Claude Agent SDK. Kept as an optional
# extra so the domain layer + its tests stay installable with zero third-party deps.
[project.optional-dependencies]
# PyJWT[crypto] backs the GitHub App installation-token mint (adapters/app_token).
sdk = [
    "claude-agent-sdk>=0.2.158",
    "pyjwt[crypto]>=2.8",
]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.6",
    "claude-agent-sdk>=0.2.158",
    "pyjwt[crypto]>=2.8",
    "import-linter>=2.0",
    # fastapi.testclient is httpx-backed; the full development gate includes
    # the optional dashboard transport so its endpoint contracts execute.
    "httpx>=0.27",
]
# The interactive web dashboard (app/dashweb). Optional by contract: no daemon
# path may import fastapi, so a deployment that never opens the dashboard never
# installs it.
dash = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/issue_agent"]

[tool.pytest.ini_options]
testpaths = [
    "tests/domain",
    "tests/adapters",
    "tests/app",
    "tests/test_residuals.py",
]
python_files = ["test_*.py"]
addopts = "-q"

[tool.pyrefly]
preset = "default"
project-includes = ["src", "tests"]
# Linked issue worktrees live below the hidden `.claude/worktrees` path, which
# Pyrefly's default dot-directory heuristic excludes. The primary checkout also
# ignores that path through its shared .git/info/exclude. Explicit project inputs
# must win over both ambient exclusions so the gate is location-independent.
disable-project-excludes-heuristics = true
use-ignore-files = false
search-path = [".", "src", "tests/domain", "tests/adapters", "tests/app"]
ignore-missing-imports = ["fastapi", "fastapi.*", "uvicorn"]

[tool.pyrefly.errors]
# Removal issues are indexed by rule in:
# docs/open/issues/pyrefly-default-backlog.md
# `make typecheck` re-enables seam-sensitive rules for the explicit authority
# port conformance module while this migration backlog is retired.
bad-argument-type = "ignore"
# On everywhere: off, it hid `EvidenceUnavailable.source` (the field is
# `required_fact`), which made every projection of that gate raise, and
# per-file re-enables went stale as files were deleted (slice 5c).
missing-attribute = "error"
bad-index = "ignore"
unsupported-operation = "ignore"
bad-assignment = "ignore"
not-iterable = "ignore"
bad-override = "ignore"
bad-specialization = "ignore"
bad-return = "ignore"
unsafe-overlap = "ignore"
no-matching-overload = "ignore"

# Tests stay at "ignore" for now: fakes and probes reach into attributes the
# declared types do not carry (~350 sites); the rule binds on src.
[[tool.pyrefly.sub-config]]
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
missing-attribute = "ignore"

# ── Architectural linting (import-linter) ─────────────────────────────────────
# Enforces the hexagonal layering the design depends on: the domain is pure
# (no adapters, no app, no SDK), and dependencies only ever point downward
# (app → adapters → domain). A violation here is a design regression, not a
# style nit — `make arch` (in `make test`) fails the build on it.
[tool.importlinter]
root_packages = ["issue_agent"]
# Required so the "forbidden" contract can reason about imports of external
# packages (claude_agent_sdk / openai) leaving the domain layer.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered: app → adapters → domain (no upward imports)"
type = "layers"
layers = [
    "issue_agent.app",
    "issue_agent.adapters",
    "issue_agent.domain",
]

[[tool.importlinter.contracts]]
name = "Domain is pure (no adapters/app/SDK imports)"
type = "forbidden"
source_modules = ["issue_agent.domain"]
forbidden_modules = [
    "issue_agent.adapters",
    "issue_agent.app",
    "claude_agent_sdk",
    "openai",
]

[[tool.importlinter.contracts]]
name = "Daemon modules do not depend on the optional web stack"
type = "forbidden"
source_modules = [
    "issue_agent.app.main",
    "issue_agent.app.tick",
    "issue_agent.app.fix",
    "issue_agent.app.review",
]
forbidden_modules = ["fastapi", "uvicorn"]

# The dashboard is a separate, read-only consumer of the core
# (docs/open/2026-10-12-minimal-harness-design.md): the core never imports it.
# Sources are each layer's children, not the layers: import-linter skips a
# source that contains a forbidden module, so `issue_agent.app` would let
# `app.fix -> app.dashweb` through. The ignored edges are the CLI's and the
# journal's existing imports, kept until the core drops them (reported by
# slice 8b; nothing may add another).
[[tool.importlinter.contracts]]
name = "The core does not import the dashboard"
type = "forbidden"
source_modules = [
    "issue_agent.domain.*",
    "issue_agent.adapters.*",
    "issue_agent.app.*",
]
forbidden_modules = [
    "issue_agent.domain.dashboard",
    "issue_agent.app.dashboard",
    "issue_agent.app.dashweb",
    "issue_agent.adapters.dashweb",
]
ignore_imports = [
    # The dashboard's own imports (it is a consumer of the core).
    "issue_agent.domain.dashboard -> issue_agent.**",
    "issue_agent.app.dashboard -> issue_agent.**",
    "issue_agent.app.dashweb -> issue_agent.**",
    "issue_agent.app.dashweb.** -> issue_agent.**",
    "issue_agent.adapters.dashweb.** -> issue_agent.**",
]

[dependency-groups]
dev = [
    "pyrefly>=1.1.1",
]
