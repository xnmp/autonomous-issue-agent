name: CI

# The harness had no CI at all until now, which mattered more than usual: the
# fixer treats a PR with zero checks (CIState.NONE) exactly like a green one, so
# pointing the harness at its own repo would have auto-merged approved PRs with
# no verification whatsoever. This workflow is the prerequisite for that
# self-hosting deployment, and a safety net for hand-merged PRs either way.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Runtime-directory tmpfs filled during the real SQLite scale contracts.
      # Keep their FULL durability while using the runner's disk-backed scratch.
      TMPDIR: ${{ runner.temp }}
      # Private Linux runners have two CPUs; avoid overlapping two worker pools.
      TEST_WORKERS: "2"
      TEST_SUITE_JOBS: "1"
    steps:
      - uses: actions/checkout@v5

      # `make test` shells out to git in temporary repos; the bash suites assert
      # on commit behaviour, so an unset identity fails them.
      - name: Configure git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      # tests/test_point_at.sh runs shellcheck; jq + gh are used by the
      # orchestration fakes. jq and gh ship on ubuntu-latest.
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Test resource capacity
        run: |
          nproc
          free -h
          df -h "$TMPDIR"
          df -i "$TMPDIR"

      # The full suite: governor + hooks + orchestration + point-at + domain +
      # adapters + gate parity + import-linter architecture contracts.
      - name: make test
        run: make test

      # Production compilation exercises the pre/post input snapshot and
      # immutable output-manifest publisher; npm test pins its race guard.
      - name: dashboard build and tests
        run: |
          make dashboard-ui
          cd dashboard && npm test

      # Hostile-env re-run of the shell suites (#63 class). Deliberately a CI
      # step and not part of `make test`: it doubles the bash suites' wall
      # clock, and `make test` is the self-hosted TEST_CMD paid on every gate
      # run — CI is the authoritative place for the expensive belt-and-braces.
      - name: make test-deployment-env
        env:
          # make test already synchronized every test extra. Bare uv run here
          # would otherwise remove the SDK/dashboard and pytest dependencies.
          UV_NO_SYNC: "1"
        run: make test-deployment-env
