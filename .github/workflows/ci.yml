name: CI

# The harness had no CI at all until now, which mattered more than usual: the
# fixer treats a PR with zero checks (CIState.NONE) exactly like a green one, so
# pointing the harness at its own repo would have auto-merged approved PRs with
# no verification whatsoever. This workflow is the prerequisite for that
# self-hosting deployment, and a safety net for hand-merged PRs either way.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # GitHub-hosted, never self-hosted: the repository is public, and a fork PR
    # runs `make test` with its own code. A runner on the operator's machine
    # would hand that code the harness credentials.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_WORKERS: "4"
      TEST_SUITE_JOBS: "2"
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v5
        with:
          # Rollback contracts archive an immutable historical SQL build.
          fetch-depth: 0
          persist-credentials: false

      # `make test` shells out to git in temporary repos; the bash suites assert
      # on commit behaviour, so an unset identity fails them.
      # The runner context is unavailable in job-level env, so later steps get
      # the per-job global config through GITHUB_ENV.
      - name: Configure git identity
        run: |
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig"
          echo "GIT_CONFIG_GLOBAL=$GIT_CONFIG_GLOBAL" >> "$GITHUB_ENV"
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      - name: Check preinstalled tools
        run: |
          for tool in bash git make jq gh shellcheck; do
            command -v "$tool" || exit 2
          done

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # uv's managed Python supports the native Linux host without requiring
      # a distribution-specific setup-python download or system changes.
      - name: Install managed Python
        run: uv python install 3.12

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Test resource capacity
        run: |
          nproc
          free -h
          df -h "${XDG_RUNTIME_DIR:-/tmp}"
          df -i "${XDG_RUNTIME_DIR:-/tmp}"

      # Reuse the existing bounded process group and per-run scratch cleanup
      # for every check, including the hostile-environment replay.
      - name: Complete CI validation
        run: |
          bash scripts/run_test_suite.sh bash -euc '
            make test
            make dashboard-ui
            (cd dashboard && npm test)
            UV_NO_SYNC=1 make test-deployment-env
          '
