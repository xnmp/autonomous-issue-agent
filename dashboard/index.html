<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <!--
      Inline SVG favicon: a robot head on a filled tile. The tile carries its
      own background so the mark reads on a light and a dark browser tab alike —
      a transparent glyph would vanish into one of them. Colours restate the
      theme's blue and bg because index.html loads before any CSS.
    -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236a7acc'/%3E%3Cg fill='%230e1330'%3E%3Ccircle cx='16' cy='4.5' r='2'/%3E%3Crect x='15' y='4' width='2' height='5'/%3E%3Crect x='6' y='9' width='20' height='15' rx='5'/%3E%3C/g%3E%3Cg fill='%23e8ecf8'%3E%3Ccircle cx='12' cy='15.5' r='2.4'/%3E%3Ccircle cx='20' cy='15.5' r='2.4'/%3E%3Crect x='12' y='20' width='8' height='1.8' rx='0.9' opacity='0.75'/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>Agent Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
