<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1320" viewBox="0 0 1180 1320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.18"/></filter>
    <marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
  </defs>
  <rect x="0" y="0" width="1180" height="1320" fill="#ffffff"/>
  <text x="590" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Inside the Fix Agent — resolve-issue.sh (DDD + TDD)</text>
  <text x="590" y="56" text-anchor="middle" font-size="13" fill="#64748b">Diagram 2 of 2 · the "TDD internals" of the resolve-issue box in Diagram 1 · each step's commit is checked by the GATE hook</text>

  <!-- gate rail on the right -->
  <rect x="980" y="86" width="174" height="1060" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="1067" y="108" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">GATE (hooks)</text>
  <text x="1067" y="126" text-anchor="middle" font-size="10.5" fill="#dc2626">fires per commit/PR</text>
  <text x="1067" y="140" text-anchor="middle" font-size="10.5" fill="#dc2626">tree-sitter governor</text>

  <!-- start -->
  <g filter="url(#sh)"><rect x="360" y="90" width="300" height="44" rx="22" fill="#e2e8f0" stroke="#334155" stroke-width="2"/></g>
  <text x="510" y="117" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">issue dispatched (ai-working)</text>

  <!-- read priors -->
  <g filter="url(#sh)"><rect x="345" y="156" width="330" height="62" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/></g>
  <text x="510" y="180" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5b21b6">Read design priors FIRST</text>
  <text x="510" y="198" text-anchor="middle" font-size="11" fill="#6d28d9">INVARIANTS.md · ADRs · folder CLAUDE.md</text>
  <text x="510" y="212" text-anchor="middle" font-size="10.5" fill="#7c3aed">+ steward's design-context comment (if any)</text>

  <!-- branch -->
  <g filter="url(#sh)"><rect x="360" y="240" width="300" height="50" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/></g>
  <text x="510" y="262" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">Create branch  feat/&lt;n&gt;-… or fix/&lt;n&gt;-…</text>
  <text x="510" y="279" text-anchor="middle" font-size="10.5" fill="#1d4ed8">checked: branch-name hook</text>

  <!-- AC -->
  <g filter="url(#sh)"><rect x="345" y="312" width="330" height="62" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/></g>
  <text x="510" y="336" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">Write &amp; post Acceptance Criteria</text>
  <text x="510" y="354" text-anchor="middle" font-size="11" fill="#1d4ed8">FIRST — before code (fixes the bar in place)</text>
  <text x="510" y="368" text-anchor="middle" font-size="10.5" fill="#1d4ed8">posted as an issue comment</text>

  <!-- Test plan -->
  <g filter="url(#sh)"><rect x="360" y="396" width="300" height="54" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/></g>
  <text x="510" y="419" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">Post ## Test Plan comment</text>
  <text x="510" y="437" text-anchor="middle" font-size="10.5" fill="#1d4ed8">writes .claude/.test-plan-posted</text>

  <!-- plan: interfaces -->
  <g filter="url(#sh)"><rect x="360" y="472" width="300" height="52" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/></g>
  <text x="510" y="494" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">Domain interfaces / types</text>
  <text x="510" y="512" text-anchor="middle" font-size="11" fill="#1d4ed8">commit  <tspan font-weight="700">plan:</tspan>  · lint+typecheck</text>

  <!-- red: tests -->
  <g filter="url(#sh)"><rect x="360" y="546" width="300" height="52" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/></g>
  <text x="510" y="568" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">Write tests (expected to fail)</text>
  <text x="510" y="586" text-anchor="middle" font-size="11" fill="#1d4ed8">commit  <tspan font-weight="700">red:</tspan>  · domain logic, written before impl</text>

  <!-- green: implement -->
  <g filter="url(#sh)"><rect x="360" y="620" width="300" height="52" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/></g>
  <text x="510" y="642" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">Implement until tests pass</text>
  <text x="510" y="660" text-anchor="middle" font-size="11" fill="#1d4ed8">commit  <tspan font-weight="700">green:</tspan>  · + structured logging</text>

  <!-- decision: tests pass? -->
  <g filter="url(#sh)"><polygon points="510,694 588,738 510,782 432,738" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/></g>
  <text x="510" y="734" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">tests pass?</text>
  <text x="510" y="751" text-anchor="middle" font-size="9.5" fill="#c2410c">run locally</text>

  <!-- /diagnose loop box (left) -->
  <g filter="url(#sh)"><rect x="80" y="704" width="244" height="68" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/></g>
  <text x="202" y="728" text-anchor="middle" font-size="12" font-weight="700" fill="#3730a3">/diagnose</text>
  <text x="202" y="745" text-anchor="middle" font-size="10" fill="#4338ca">reproduce→minimise→hypothesise</text>
  <text x="202" y="759" text-anchor="middle" font-size="10" fill="#4338ca">→instrument→fix→regression-test</text>

  <!-- evidence -->
  <g filter="url(#sh)"><rect x="360" y="812" width="300" height="56" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/></g>
  <text x="510" y="835" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">Collect proof → evidence/</text>
  <text x="510" y="853" text-anchor="middle" font-size="10.5" fill="#1d4ed8">gitignored · NOT committed (posted on PR)</text>

  <!-- docs -->
  <g filter="url(#sh)"><rect x="360" y="888" width="300" height="52" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/></g>
  <text x="510" y="910" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">Update folder CLAUDE.md</text>
  <text x="510" y="928" text-anchor="middle" font-size="11" fill="#1d4ed8">commit  <tspan font-weight="700">docs:</tspan>  · non-obvious learnings</text>

  <!-- ADVERSARIAL pre-PR (subagent spawned by the fix agent) -->
  <g filter="url(#sh)"><rect x="312" y="960" width="396" height="82" rx="9" fill="#fdf4ff" stroke="#a21caf" stroke-width="1.6"/></g>
  <text x="510" y="983" text-anchor="middle" font-size="12.5" font-weight="700" fill="#86198f">Adversarial pre-PR review</text>
  <text x="510" y="1001" text-anchor="middle" font-size="11" fill="#a21caf">fix agent spawns a SUBAGENT (fresh context)</text>
  <text x="510" y="1016" text-anchor="middle" font-size="10.5" fill="#a21caf">given only diff + evidence + AC → returns PASS / FAIL</text>
  <text x="510" y="1031" text-anchor="middle" font-size="10" fill="#a21caf">agent writes .claude/.adversarial-verdict (hook variant: check-pr.sh runs it)</text>

  <!-- decision: verdict PASS? -->
  <g filter="url(#sh)"><polygon points="510,1058 588,1102 510,1146 432,1102" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/></g>
  <text x="510" y="1098" text-anchor="middle" font-size="11.5" font-weight="700" fill="#9a3412">PASS?</text>
  <text x="510" y="1114" text-anchor="middle" font-size="9" fill="#c2410c">verdict file</text>

  <!-- open PR -->
  <g filter="url(#sh)"><rect x="345" y="1180" width="330" height="60" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/></g>
  <text x="510" y="1204" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">gh pr create → dev</text>
  <text x="510" y="1222" text-anchor="middle" font-size="10.5" fill="#1d4ed8">## Acceptance Criteria · Fixes #n · PR-gate hook runs</text>

  <!-- exit to diagram 1 -->
  <g filter="url(#sh)"><rect x="745" y="1186" width="230" height="48" rx="24" fill="#e2e8f0" stroke="#334155" stroke-width="2"/></g>
  <text x="860" y="1208" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">ai-pr-open</text>
  <text x="860" y="1224" text-anchor="middle" font-size="9.5" fill="#64748b">→ Diagram 1, PHASE 2</text>

  <!-- blocked exit (if cannot proceed) -->
  <g filter="url(#sh)"><rect x="60" y="312" width="216" height="62" rx="9" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/></g>
  <text x="168" y="336" text-anchor="middle" font-size="12" font-weight="700" fill="#854d0e">status = blocked</text>
  <text x="168" y="354" text-anchor="middle" font-size="10.5" fill="#a16207">state exactly what's needed,</text>
  <text x="168" y="368" text-anchor="middle" font-size="10.5" fill="#a16207">stop → ai-blocked (Diagram 1)</text>

  <!-- ========== EDGES (happy path bold) ========== -->
  <g fill="none" stroke="#1e293b" stroke-width="2.5">
    <path d="M510,134 L510,154" marker-end="url(#aD)"/>
    <path d="M510,218 L510,238" marker-end="url(#aD)"/>
    <path d="M510,290 L510,310" marker-end="url(#aD)"/>
    <path d="M510,374 L510,394" marker-end="url(#aD)"/>
    <path d="M510,450 L510,470" marker-end="url(#aD)"/>
    <path d="M510,524 L510,544" marker-end="url(#aD)"/>
    <path d="M510,598 L510,618" marker-end="url(#aD)"/>
    <path d="M510,672 L510,692" marker-end="url(#aD)"/>
    <path d="M510,782 L510,810" marker-end="url(#aD)"/>
    <path d="M510,868 L510,886" marker-end="url(#aD)"/>
    <path d="M510,940 L510,962" marker-end="url(#aD)"/>
    <path d="M510,1038 L510,1056" marker-end="url(#aD)"/>
    <path d="M510,1146 L510,1178" marker-end="url(#aD)"/>
    <path d="M675,1210 L743,1210" marker-end="url(#aD)"/>
  </g>
  <!-- decision yes labels -->
  <g font-size="10.5" font-weight="700">
    <rect x="516" y="788" width="36" height="15" rx="3" fill="#ffffff"/><text x="534" y="800" text-anchor="middle" fill="#15803d">yes</text>
    <rect x="516" y="1152" width="36" height="15" rx="3" fill="#ffffff"/><text x="534" y="1164" text-anchor="middle" fill="#15803d">yes</text>
  </g>

  <!-- tests fail -> /diagnose -> back to implement -->
  <g fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4">
    <path d="M432,738 L326,738" marker-end="url(#aR)"/>
  </g>
  <g fill="none" stroke="#6366f1" stroke-width="1.6" stroke-dasharray="5 4">
    <path d="M202,704 C202,646 356,646 358,646" marker-end="url(#aP)"/>
  </g>
  <g font-size="10" font-weight="700">
    <rect x="350" y="722" width="34" height="15" rx="3" fill="#fef2f2"/><text x="367" y="734" text-anchor="middle" fill="#b91c1c">no</text>
    <rect x="210" y="636" width="120" height="15" rx="3" fill="#eef2ff"/><text x="270" y="648" text-anchor="middle" fill="#4338ca">fix → re-run green:</text>
  </g>

  <!-- adversarial FAIL -> back to implement (purple) -->
  <g fill="none" stroke="#a21caf" stroke-width="1.6" stroke-dasharray="5 4">
    <path d="M432,1102 C150,1102 60,1102 60,646 C60,628 356,640 358,642" marker-end="url(#aP)"/>
  </g>
  <g font-size="10" font-weight="700">
    <rect x="150" y="1086" width="150" height="15" rx="3" fill="#fdf4ff"/><text x="225" y="1098" text-anchor="middle" fill="#86198f">FAIL → fix &amp; re-verify</text>
  </g>

  <!-- cannot proceed -> blocked (amber), from AC/any step; drawn from read-priors area -->
  <g fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 4">
    <path d="M345,338 L276,340" marker-end="url(#aA)"/>
  </g>
  <text x="310" y="330" text-anchor="middle" font-size="10" font-weight="700" fill="#b45309">stuck</text>

  <!-- gate checks (thin red ticks from commit steps to rail) -->
  <g fill="none" stroke="#fca5a5" stroke-width="1.3" stroke-dasharray="3 3">
    <path d="M660,265 L980,210" marker-end="url(#aR)"/>
    <path d="M660,498 L980,360" marker-end="url(#aR)"/>
    <path d="M660,572 L980,470" marker-end="url(#aR)"/>
    <path d="M660,646 L980,580" marker-end="url(#aR)"/>
    <path d="M660,914 L980,720" marker-end="url(#aR)"/>
    <path d="M675,1210 L980,900" marker-end="url(#aR)"/>
  </g>
  <text x="1067" y="980" text-anchor="middle" font-size="10" fill="#dc2626">blocks --no-verify,</text>
  <text x="1067" y="996" text-anchor="middle" font-size="10" fill="#dc2626">core.hooksPath bypass,</text>
  <text x="1067" y="1012" text-anchor="middle" font-size="10" fill="#dc2626">bad prefixes/branch,</text>
  <text x="1067" y="1028" text-anchor="middle" font-size="10" fill="#dc2626">missing test/AC/evidence</text>

  <!-- legend -->
  <rect x="40" y="1258" width="1100" height="46" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
  <g font-size="11.5">
    <rect x="58" y="1274" width="18" height="12" rx="3" fill="#dbeafe" stroke="#2563eb"/><text x="82" y="1284" fill="#334155">fix-agent action</text>
    <rect x="190" y="1274" width="18" height="12" rx="3" fill="#eff6ff" stroke="#3b82f6"/><text x="214" y="1284" fill="#334155">committed step (prefix)</text>
    <rect x="370" y="1274" width="18" height="12" rx="3" fill="#fdf4ff" stroke="#a21caf"/><text x="394" y="1284" fill="#334155">adversarial subagent</text>
    <rect x="586" y="1274" width="18" height="12" rx="3" fill="#f5f3ff" stroke="#7c3aed"/><text x="610" y="1284" fill="#334155">steward priors</text>
    <polygon points="712,1274 724,1278 724,1286 712,1290 700,1286 700,1278" fill="#fff7ed" stroke="#ea580c"/><text x="732" y="1284" fill="#334155">decision</text>
    <line x1="812" y1="1280" x2="852" y2="1280" stroke="#1e293b" stroke-width="2.5" marker-end="url(#aD)"/><text x="858" y="1284" fill="#334155">happy path</text>
    <line x1="968" y1="1280" x2="1008" y2="1280" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="3 3"/><text x="1014" y="1284" fill="#334155">gate check</text>
  </g>
</svg>
